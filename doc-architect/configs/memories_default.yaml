# DP1 대상 메모리 구성 — 시뮬레이션 기본값
#
# 설계 문서: ../dp1-heterogeneous-memory-data-placement.md  (§3 대상 메모리 구성)
#
# [중요] 모든 수치는 공개 자료 기반 대표값이며 벤더 데이터가 아니다.
#        각 항목의 `src:` 주석이 출처를 밝히며, 다음 세 등급으로 표기한다.
#
#          SPEC    규격서에 명시된 값 (PCIe, HBM4, OCP HBF 등)
#          PUBLIC  벤더/논문이 공개한 플랫폼 수치
#          ASSUMED 공개 정량값이 없어 본 구성에서 가정한 값
#
#        ASSUMED 항목은 결론을 뒤집을 수 있으므로 설계 문서 §11.6의
#        Sweep 축에 반드시 포함한다.
#
# [대역폭 정의]
#   ext_bw : GPU에서 이 메모리에 도달하는 경로(링크)의 대역폭.
#            KV를 GPU로 끌어올 때 적용된다.
#   int_bw : 메모리 내부 연산 유닛이 자기 DRAM/NAND에 접근하는 대역폭.
#            Attention 오프로드(설계 문서 §4) 시 적용된다.
#   두 값을 하나로 합치면 §3.3의 외부/내부 비대칭이 사라지고
#   연산 오프로드가 왜 값을 하는지 모델에서 표현되지 않는다.
#
# [supported_primitives]
#   "GEMV를 지원한다"와 "Attention을 처리할 수 있다"는 다르다.
#   Attention을 그 메모리에서 끝내려면 QK_GEMM, SOFTMAX, AV_GEMM,
#   CAUSAL_MASK를 모두 지원해야 한다. 하나라도 빠지면 오프로드 대상이
#   아니다 (설계 문서 §4.5).

schema_version: 1

# 4장의 정량 비교를 config에서 재현하기 위한 기준 GPU와 가정 모델.
# calc_attention.py가 이 값들로 표를 생성한다.
gpu:
  name: reference_gpu
  hbm_bw_bytes_per_s:       8.0e+12   # 8.0 TB/s   src: PUBLIC 8-stack 집계
  compute_tflops_fp16:      2.0e+15   # 2000 TFLOPS src: PUBLIC 현세대 가속기 dense fp16 peak 급
  attention_bw_efficiency:      0.9   # src: ASSUMED GPU attention 커널 대역폭 달성률
  attention_flops_efficiency:   0.5   # src: ASSUMED attention은 dense GEMM보다 peak 달성률이 낮다

model:
  name: dense_70b_class            # 4장 가정 모델. 실제 모델로 교체 가능
  num_layers: 80
  hidden: 8192
  num_heads: 64
  num_kv_heads: 8                  # GQA 8:1 -> Decode attention의 연산 강도 = 8 FLOP/B
  head_dim: 128
  dtype_bytes: 2
  context_tokens: 32768
  incremental_prefill_tokens: 512  # Agent turn의 Tool Result 크기 대표값


memories:

  # ────────────────────────────────────────────────────────────────
  - name: hbm
    medium: HBM
    role: GPU 노드의 주 메모리 (on-package)
    capacity_bytes:     206158430208   # 192 GiB
    ext_bw_bytes_per_s:       8.0e+12  # 8.0 TB/s   src: PUBLIC 8-stack 집계 대역폭. 스택당 2.0~3.3 TB/s(HBM4 SPEC)
                                       #                        [주의] 스택당이 아니라 GPU 한 장의 집계값이다.
                                       #                        capacity도 8-stack 기준이므로 단위를 맞춘 것
    int_bw_bytes_per_s:       8.0e+12  # 8.0 TB/s   src: PUBLIC 연산 유닛 없음 — ext와 동일하게 둔다
    latency_s:                3.0e-07  # 300 ns     src: PUBLIC HBM 접근 지연 대표값
    gpu_reachable: true
    supported_primitives: []           # 연산 기능 없음
    compute_tflops_fp16:            null  # src: 연산 기능 없음
    attention_bw_efficiency:        null  # src: ASSUMED Attention 커널이 int_bw 중 실제로 달성하는 비율
    write_amplification: 1.0
    endurance_budget_bytes: null       # DRAM — 실질적 무제한
    provenance: "PUBLIC: 8-stack aggregate HBM bandwidth; per-stack 2.0-3.3 TB/s is SPEC (HBM4)"

  - name: custom_hbm
    medium: CUSTOM_HBM
    role: GPU 노드 옆의 별도 메모리 노드. Custom HBM만으로 구성되며 GPU-HBM을 대체한다
    capacity_bytes:    1099511627776   # 1.00 TiB   src: ASSUMED GPU HBM(192 GiB)의 약 5배.
                                       #                         연산 다이가 면적을 다투지 않는 전용 메모리 노드이므로
                                       #                         스택을 훨씬 많이 실을 수 있다는 전제
    ext_bw_bytes_per_s:       9.0e+11  # 0.9 TB/s   src: SPEC   NVLink 5 방향당 900 GB/s (18 link x 100 GB/s 양방향 = 1.8 TB/s)
                                       #                        별도 노드이므로 on-package가 아니라 scale-up fabric을 탄다.
                                       #                        UALink 1.0은 lane당 200 Gbps이며 lane 수로 이 대역을 맞춘다
    int_bw_bytes_per_s:       8.0e+12  # 8.0 TB/s   src: ASSUMED 노드 내부 HBM 스택 집계. 근접 연산 유닛이
                                       #                         fabric을 거치지 않고 접근한다는 전제.
                                       #                         공개 정량값 없음 -> 설계 문서 11.6 Sweep 필수 축
    latency_s:                1.0e-06  # 1 us       src: ASSUMED scale-up fabric 한 홉. on-package(300 ns)보다 크다
    hops: [gpu->dev:scaleup_fabric]    # 한 홉. CPU를 경유하지 않는다
    gpu_reachable: true                # fabric이 memory semantics를 제공한다는 전제 (NVLink-C2C 방식)
    supported_primitives: [QK_GEMM, SOFTMAX, AV_GEMM, CAUSAL_MASK]
    compute_tflops_fp16:         3.2e+13  # src: ASSUMED 32 TFLOPS fp16. 근접 연산 유닛 규모는 공개값 없음 -> HW 확인 항목 (3.6)
    attention_bw_efficiency:         0.7  # src: ASSUMED Attention 커널이 int_bw 중 실제로 달성하는 비율
    write_amplification: 1.0
    endurance_budget_bytes: null
    provenance: "ext=SPEC NVLink 5 (900 GB/s per direction); capacity, int BW, latency = ASSUMED (separate memory node)"
    note: >
      별도 노드이므로 외부/내부 비대칭이 약 8.9배로 크다. GPU가 fabric으로 KV를 읽으면
      로컬 HBM 대비 8.9배 느리지만, 노드 안에서 Attention을 수행하면 로컬 HBM과 대등한
      처리량을 내면서 용량은 5배가 된다. 따라서 이 노드에서는 Attention 오프로드가
      선택이 아니라 사실상 전제다 (설계 문서 4.4).

  - name: cxl_pnm
    medium: CXL_PNM
    role: 대용량 연산형 확장 메모리 (LPDDR5X 기반)
    capacity_bytes:     549755813888   # 512 GiB
    ext_bw_bytes_per_s:        6.4e+10  # 64 GB/s    src: SPEC   PCIe 5.0 x16 방향당 64 GB/s
                                       #                        (PCIe 6.0 x16 = 128, 7.0 x16 = 256 GB/s 목표)
    int_bw_bytes_per_s:        1.1e+12  # 1.1 TB/s   src: PUBLIC LPDDR5X 기반 CXL-PNM 플랫폼 공개값
    latency_s:                 2.5e-7  # 250 ns     src: PUBLIC CXL.mem load-to-use 170~250 ns 범위의 상단.
                                       #                        CPU 홉을 거치므로 보수적으로 상단을 쓴다
    hops: [gpu->cpu:pcie, cpu->dev:cxl]   # GPU에서 두 홉
    gpu_reachable: false
    supported_primitives: [QK_GEMM, SOFTMAX, AV_GEMM, CAUSAL_MASK]
    compute_tflops_fp16:         1.6e+13  # src: ASSUMED 16 TFLOPS fp16. 공개값 없음 -> HW 확인 항목 (3.6)
    attention_bw_efficiency:         0.7  # src: ASSUMED Attention 커널이 int_bw 중 실제로 달성하는 비율
    write_amplification: 1.0
    endurance_budget_bytes: null
    provenance: "ext=SPEC PCIe 5.0 x16; int/capacity=PUBLIC LPDDR5X CXL-PNM platform"
    note: >
      외부/내부 비대칭이 약 17배로 이 구성에서 가장 크다.
      KV를 링크로 끌어내는 순간 1.1 TB/s짜리 메모리를 64 GB/s로 쓰게 되므로,
      여기 둔 KV는 옮기지 말고 연산을 보내야 한다 (설계 문서 §4).

  # ────────────────────────────────────────────────────────────────
  - name: dram
    medium: DRAM
    role: CPU 측 주 메모리
    capacity_bytes:    1099511627776   # 1 TiB
    ext_bw_bytes_per_s:        6.4e+10  # 64 GB/s    src: SPEC   GPU에서는 PCIe 5.0 x16 경유가 병목
    int_bw_bytes_per_s:        4.0e+11  # 400 GB/s   src: SPEC   DDR5-6400 채널당 51.2 GB/s × 8채널급.
                                       #                        연산 기능은 없으므로 참고값
    latency_s:                 2.0e-7  # 200 ns     src: PUBLIC 로컬 DRAM 80~100 ns + PCIe 경유분
    hops: [gpu->cpu:pcie]
    gpu_reachable: false
    supported_primitives: []
    compute_tflops_fp16:            null  # src: 연산 기능 없음
    attention_bw_efficiency:        null  # src: ASSUMED Attention 커널이 int_bw 중 실제로 달성하는 비율
    write_amplification: 1.0
    endurance_budget_bytes: null
    provenance: "SPEC: DDR5-6400 51.2 GB/s per channel; ext limited by PCIe 5.0 x16"

  # ────────────────────────────────────────────────────────────────
  - name: hbf
    medium: HBF
    role: 고대역 플래시 (HBM과 SSD 사이 용량 계층)
    capacity_bytes:    2199023255552   # 2 TiB      src: SPEC   OCP 규격 스택당 512 GB × 4 스택
    ext_bw_bytes_per_s:        1.0e+12  # 1.0 TB/s   src: SPEC   OCP 규격 3개 등급 0.4~3.0 TB/s 중 중간 등급.
                                       #                        UCIe로 프로세서에 연결
    int_bw_bytes_per_s:        1.0e+12  # 1.0 TB/s   src: SPEC   연산 기능 없음 — ext와 동일하게 둔다
    write_bw_bytes_per_s:      5.0e+10  # 50 GB/s    src: ASSUMED 읽기의 1/20. NAND의 read/write 비대칭을
                                       #                         반영한 가정. OCP 규격에 쓰기 측 정량값 없음
                                       #                         → 설계 문서 §11.6 Sweep 필수 축
    latency_s:                 5.0e-6  # 5 us       src: ASSUMED NAND read 지연. DRAM보다 한 자릿수 이상 크다
    gpu_reachable: true                # UCIe on-package
    supported_primitives: []
    compute_tflops_fp16:            null  # src: 연산 기능 없음
    attention_bw_efficiency:        null  # src: ASSUMED Attention 커널이 int_bw 중 실제로 달성하는 비율
    write_amplification: 3.0           # src: ASSUMED NAND GC 포함
    endurance_budget_bytes:    1.0e+17  # 100 PB     src: ASSUMED → §11.6 Sweep 필수 축
    provenance: "capacity/read BW/UCIe = SPEC (OCP HBF technical specification, FMS 2026); write BW, latency, WA, endurance = ASSUMED"
    note: >
      읽기 대역폭은 HBM에 근접하지만 매체가 NAND이므로 쓰기가 비싸고 수명이 유한하다.
      비활성 전환마다 쓰고 재활성마다 읽는 왕복이 반복되면 수명이 소모되므로,
      왕복 빈도가 높을 KV를 여기 두면 안 된다 (설계 문서 §11.5 M-E1).

  # ────────────────────────────────────────────────────────────────
  - name: ssd_pim
    medium: SSD_PIM
    role: 연산 기능 내장 스토리지 (장기 보관)
    capacity_bytes:   17592186044416   # 16 TiB
    ext_bw_bytes_per_s:        1.6e+10  # 16 GB/s    src: SPEC    PCIe 5.0 x4
    int_bw_bytes_per_s:        2.0e+11  # 200 GB/s   src: ASSUMED 내부 NAND 채널 집계. 호스트 링크보다
                                       #                         높다는 것이 PIM의 존재 이유
    latency_s:                 6.0e-5  # 60 us      src: PUBLIC  NVMe 읽기 지연 대표값
    hops: [gpu->cpu:pcie, cpu->dev:nvme]
    gpu_reachable: false
    supported_primitives: [QK_GEMM, AV_GEMM]   # SOFTMAX 미지원 → Attention 오프로드 대상 아님
    compute_tflops_fp16:         2.0e+12  # src: ASSUMED 2 TFLOPS fp16. SOFTMAX 미지원이라 Attention 오프로드 대상은 아님
    attention_bw_efficiency:         0.5  # src: ASSUMED Attention 커널이 int_bw 중 실제로 달성하는 비율
    write_amplification: 4.0           # src: ASSUMED
    endurance_budget_bytes:    1.0e+16  # 10 PB      src: ASSUMED
    provenance: "ext=SPEC PCIe 5.0 x4; latency=PUBLIC NVMe; int BW, WA, endurance = ASSUMED"
    note: >
      supported_primitives에 SOFTMAX가 없으므로 reactivation_mode_for()가
      ATTENTION_OFFLOAD를 반환하지 않는다. 이것이 "GEMV 지원 != Attention 지원"을
      타입으로 강제하는 지점이다 (설계 문서 §4.5).
      지연이 us 급이라 계층당 왕복 × 계층 수가 대화형 경로 예산을 넘는다 (§4.3).

name: DP1 architecture evaluation

on:
  push:
    branches:
      - claude/dp1-ai-data-placement
    paths:
      - 'doc-architect/dp1_eval/**'
      - 'doc-architect/configs/**'
      - '.github/workflows/dp1-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dp1-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        working-directory: doc-architect/dp1_eval
        run: python -m unittest -v test_eval.py
      - name: Run baseline evaluator
        working-directory: doc-architect/dp1_eval
        run: python run_eval.py
      - name: Run reinforcement evaluator
        working-directory: doc-architect/dp1_eval
        run: python run_reinforcement.py
      - name: Run V2 evaluator
        working-directory: doc-architect/dp1_eval
        run: python run_v2.py
      - name: Run V2 pure performance evaluator
        working-directory: doc-architect/dp1_eval
        run: python run_v2_pure.py
      - name: Run representative QA evaluator
        working-directory: doc-architect/dp1_eval
        run: python run_v2_representative.py
      - name: Run overall tradeoff QA evaluator
        working-directory: doc-architect/dp1_eval
        run: python run_v2_tradeoff.py
      - name: Upload baseline results
        uses: actions/upload-artifact@v4
        with:
          name: dp1-eval-results
          path: doc-architect/dp1_eval/out/
      - name: Upload reinforcement results
        uses: actions/upload-artifact@v4
        with:
          name: dp1-reinforcement-results
          path: doc-architect/dp1_eval/out_reinforcement/
      - name: Upload V2 results
        uses: actions/upload-artifact@v4
        with:
          name: dp1-v2-results
          path: doc-architect/dp1_eval/out_v2/
      - name: Upload V2 pure performance results
        uses: actions/upload-artifact@v4
        with:
          name: dp1-v2-pure-results
          path: doc-architect/dp1_eval/out_v2_pure/
      - name: Upload representative QA results
        uses: actions/upload-artifact@v4
        with:
          name: dp1-v2-representative-qa
          path: doc-architect/dp1_eval/out_v2_representative/
      - name: Upload overall tradeoff QA results
        uses: actions/upload-artifact@v4
        with:
          name: dp1-v2-overall-tradeoff-qa
          path: doc-architect/dp1_eval/out_v2_tradeoff/
